<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Hidéyssy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #f2e9da;
      --paper-2: #e8dcc6;
      --black: #181410;
      --ink: #241d16;
      --ink-soft: #6b5c48;
      --kraft: #7a5236;
      --brass: #c7a24c;
      --teal: #3e5c56;
      --focus: #3e5c56;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "EB Garamond", serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 8% 12%, rgba(122, 82, 54, 0.05) 0 120px, transparent 121px),
        radial-gradient(circle at 92% 85%, rgba(199, 162, 76, 0.06) 0 160px, transparent 161px),
        radial-gradient(circle at 85% 15%, rgba(62, 92, 86, 0.04) 0 90px, transparent 91px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.2rem 6vw 1.4rem;
      border-bottom: 1px solid rgba(24, 20, 16, 0.14);
    }

    .logo {
      font-family: "Abril Fatface", serif;
      font-size: 1.25rem;
      letter-spacing: 0.01em;
    }

    .home-link {
      font-family: "Space Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      border-bottom: 1px solid rgba(24, 20, 16, 0.3);
      padding-bottom: 2px;
      transition: color .2s ease, border-color .2s ease;
    }

    .home-link:hover {
      color: var(--teal);
      border-color: var(--teal);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 4.5rem 6vw 3rem;
      text-align: center;
    }

    .eyebrow {
      font-family: "Space Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--kraft);
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: "Abril Fatface", serif;
      font-size: clamp(2.3rem, 6vw, 3.6rem);
      line-height: 1.15;
      color: var(--ink);
    }

    .subtitle {
      margin: 1.2rem auto 0;
      max-width: 38ch;
      color: var(--ink-soft);
      font-size: 1.05rem;
      font-style: italic;
    }

    .player {
      position: relative;
      max-width: 520px;
      margin: 3.6rem auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    .flip-btn {
      all: unset;
      width: 100%;
      aspect-ratio: 1/1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: block;
    }

    .flip-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(.4, .2, .2, 1);
    }

    .flip-btn.is-flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .record-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .record-face.back {
      transform: rotateY(180deg);
      background: radial-gradient(circle at 40% 32%, #f6ead0, var(--paper-2) 55%, #d9c9a6 100%);
      box-shadow: 0 18px 40px rgba(24, 20, 16, 0.28);
    }

    .back-text {
      max-width: 70%;
      font-family: "Abril Fatface", serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--kraft);
    }

    .back-text span {
      display: block;
      font-family: "Space Mono", monospace;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      margin-bottom: 0.6rem;
    }

    .record {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          #232019 0 2px,
          #1c1914 2px 7px);
      box-shadow: 0 18px 40px rgba(24, 20, 16, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 16s linear infinite;
      position: relative;
      overflow: hidden;
    }

    .record::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle, transparent 0 2px, rgba(255, 255, 255, 0.035) 2px 3px),
        conic-gradient(from 200deg,
          transparent 0deg,
          rgba(255, 255, 255, 0.18) 16deg,
          transparent 36deg,
          transparent 200deg,
          rgba(255, 255, 255, 0.09) 214deg,
          transparent 232deg);
      animation: spin 16s linear infinite reverse;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    /* ターンテーブルの台座（盤に地に足がついた印象を出す） */
    .player::before {
      content: "";
      position: absolute;
      inset: -6%;
      z-index: -1;
      border-radius: 20px;
      background:
        radial-gradient(circle at center, transparent 33%, rgba(90, 60, 30, 0.08) 34%, transparent 36%),
        linear-gradient(var(--paper), var(--paper-2));
    }

    .etching {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {

      .record,
      .record::before {
        animation: none;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .label {
      width: 58%;
      aspect-ratio: 1/1;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 32%, #d8b768, var(--brass) 40%, #a9803a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.4rem;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(24, 20, 16, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.15), 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .label::after {
      content: "";
      position: absolute;
      width: 8%;
      aspect-ratio: 1/1;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 0 0 3px rgba(24, 20, 16, 0.15);
    }

    .label .side {
      font-family: "Space Mono", monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: rgba(24, 20, 16, 0.6);
      margin-bottom: 0.4rem;
    }

    .label .title {
      font-family: "Abril Fatface", serif;
      font-size: 1.05rem;
      color: var(--black);
      margin-bottom: 0.7rem;
    }

    .tonearm {
      position: absolute;
      top: -2%;
      right: -6%;
      width: 46%;
      height: 46%;
      transform-origin: 88% 12%;
      transform: rotate(-18deg);
      transition: transform .35s ease;
      pointer-events: none;
      z-index: 3;
    }

    .tonearm svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .tracklist {
      position: relative;
      z-index: 1;
      margin-top: 3.2rem;
      display: flex;
      flex-direction: column;
      max-width: 520px;
      margin-inline: auto;
      border-top: 1px solid rgba(24, 20, 16, 0.16);
    }

    .track {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.05rem 0.4rem;
      border-bottom: 1px solid rgba(24, 20, 16, 0.16);
      text-align: left;
      position: relative;
      transition: background .25s ease, padding-left .25s ease;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><circle cx='26' cy='6' r='4.5' fill='%232a241c'/><line x1='26' y1='6' x2='6' y2='26' stroke='%232a241c' stroke-width='3' stroke-linecap='round'/><circle cx='6' cy='26' r='3' fill='%23c7a24c'/></svg>") 6 26, pointer;
    }

    .track::before {
      content: "";
      position: absolute;
      left: 0.3rem;
      top: 50%;
      width: 22px;
      height: 9px;
      transform: translateY(-50%) rotate(-28deg);
      border-top: 2px solid var(--brass);
      border-right: 5px solid var(--brass);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .track:hover,
    .track:focus-visible {
      background: rgba(199, 162, 76, 0.14);
      padding-left: 1.9rem;
    }

    .track:hover::before,
    .track:focus-visible::before {
      opacity: 1;
    }

    .track .num {
      font-family: "Space Mono", monospace;
      font-size: 0.78rem;
      color: var(--kraft);
      width: 1.6rem;
      flex-shrink: 0;
    }

    .track .name {
      flex: 1;
      font-size: 1.1rem;
    }

    .track .val {
      font-family: "Space Mono", monospace;
      font-size: 0.82rem;
      color: var(--ink-soft);
      text-align: right;
    }

    /* トラックごとに終着角度の異なるバウンドを個別のキーフレームで定義
     （共通の1つのアニメーションに後から角度を上書きしようとすると、
     実行中のアニメーションが静的なtransformを無視してしまうため、
     必ずトラックごとに別々のanimationとして持たせている） */
    @keyframes needle-drop-1 {
      0% {
        transform: rotate(-18deg) translateY(-2px);
      }

      55% {
        transform: rotate(-34deg) translateY(8px);
      }

      72% {
        transform: rotate(-31deg) translateY(-2px);
      }

      100% {
        transform: rotate(-32deg) translateY(0);
      }
    }

    @keyframes needle-drop-2 {
      0% {
        transform: rotate(-18deg) translateY(-2px);
      }

      55% {
        transform: rotate(-20deg) translateY(8px);
      }

      72% {
        transform: rotate(-17deg) translateY(-2px);
      }

      100% {
        transform: rotate(-18deg) translateY(0);
      }
    }

    @keyframes needle-drop-3 {
      0% {
        transform: rotate(-18deg) translateY(-2px);
      }

      55% {
        transform: rotate(-6deg) translateY(8px);
      }

      72% {
        transform: rotate(-3deg) translateY(-2px);
      }

      100% {
        transform: rotate(-4deg) translateY(0);
      }
    }

    .player:has(.track1:hover) .tonearm,
    .player:has(.track1:focus-visible) .tonearm {
      animation: needle-drop-1 .45s cubic-bezier(.2, .9, .3, 1) forwards;
    }

    .player:has(.track2:hover) .tonearm,
    .player:has(.track2:focus-visible) .tonearm {
      animation: needle-drop-2 .45s cubic-bezier(.2, .9, .3, 1) forwards;
    }

    .player:has(.track3:hover) .tonearm,
    .player:has(.track3:focus-visible) .tonearm {
      animation: needle-drop-3 .45s cubic-bezier(.2, .9, .3, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {

      .player:has(.track1:hover) .tonearm,
      .player:has(.track1:focus-visible) .tonearm {
        animation: none;
        transform: rotate(-32deg);
      }

      .player:has(.track2:hover) .tonearm,
      .player:has(.track2:focus-visible) .tonearm {
        animation: none;
        transform: rotate(-18deg);
      }

      .player:has(.track3:hover) .tonearm,
      .player:has(.track3:focus-visible) .tonearm {
        animation: none;
        transform: rotate(-4deg);
      }
    }

    .hint {
      margin-top: 1.6rem;
      font-family: "Space Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      opacity: 0.75;
    }

    footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 2.4rem 6vw 2.6rem;
      margin-top: 3.5rem;
      border-top: 1px solid rgba(24, 20, 16, 0.14);
      font-family: "Space Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }

    @media (max-width:700px) {
      main {
        padding: 3.6rem 6vw 2rem;
      }

      .player {
        max-width: 280px;
      }

      .track .name {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">Hidéyssy</a>
    <a href="index.html" class="home-link">← Home</a>
  </header>

  <main>
    <p class="eyebrow">Side A · Contact</p>
    <h1>Play a message.</h1>
    <p class="subtitle">好きな連絡方法に、そっと針を落としてください。</p>

    <div class="player">
      <button class="flip-btn" id="flipBtn" aria-label="レコードをひっくり返す">
        <span class="flip-inner">
          <span class="record-face front">
            <span class="record">
              <svg class="etching" viewBox="0 0 200 200" aria-hidden="true">
                <path id="etchPath" d="M 100,100 m -78,0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none" />
                <text font-family="Space Mono, monospace" font-size="6.5" letter-spacing="2.5"
                  fill="rgba(242,233,218,0.35)">
                  <textPath href="#etchPath" startOffset="0%">H-0001-A ヒデイシィ ・ GET IN TOUCH ・ H-0001-A ヒデイシィ ・ GET IN
                    TOUCH ・</textPath>
                </text>
              </svg>
              <span class="label">
                <span class="side">SIDE A</span>
                <span class="title">Hidéyssy</span>
              </span>
            </span>
          </span>
          <span class="record-face back">
            <span class="back-text"><span>SIDE B</span>記録より、記憶を。</span>
          </span>
        </span>
      </button>
      <div class="tonearm" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle cx="88" cy="12" r="7" fill="#2a241c" />
          <line x1="88" y1="12" x2="18" y2="70" stroke="#2a241c" stroke-width="3" stroke-linecap="round" />
          <circle cx="18" cy="70" r="4" fill="#c7a24c" />
        </svg>
      </div>
    </div>
    <p class="hint">盤面をクリックすると、B面が見られます</p>

    <div class="tracklist">
      <a class="track track1" href="mailto:hideyssy.s.mail@gmail.com">
        <span class="num">01</span>
        <span class="name">Email</span>
        <span class="val">hideyssy.s.mail@gmail.com</span>
      </a>
      <a class="track track2" href="https://instagram.com/hideyssy" target="_blank" rel="noopener">
        <span class="num">02</span>
        <span class="name">Instagram</span>
        <span class="val">@hideyssy</span>
      </a>
      <a class="track track3" href="https://x.com/hideyssy" target="_blank" rel="noopener">
        <span class="num">03</span>
        <span class="name">X </span>
        <span class="val">@hideyssy</span>
      </a>
    </div>
  </main>

  <footer>
    <span>© 2025 Hidéyssy</span>
    <span>素敵な日にしよう</span>
    <span>hideyssy.com</span>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('flipBtn');
      btn.addEventListener('click', function () {
        btn.classList.toggle('is-flipped');
      });
    })();
  </script>

</body>

</html>
