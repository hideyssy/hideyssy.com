<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f3;
      --board-bg: #c9b89a;
      --cell-bg: rgba(220, 200, 170, 0.45);
      --text-dark: #3d3228;
      --text-mid: #7a6a5a;
      --text-light: #f9f6f2;
      --accent: #e8a14a;
    }

    body {
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-dark);
      box-sizing: border-box;
    }

    #game-wrap {
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-family: 'DM Mono', monospace;
      font-size: 3rem;
      font-weight: 500;
      letter-spacing: -2px;
      color: var(--text-dark);
      line-height: 1;
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 1rem;
    }

    #scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: var(--board-bg);
      border-radius: 8px;
      padding: 6px 16px;
      text-align: center;
      min-width: 72px;
    }

    .score-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-light);
      opacity: 0.8;
      text-transform: uppercase;
    }

    .score-val {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-light);
    }

    #controls {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 8px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: var(--board-bg);
      color: var(--text-light);
      letter-spacing: 0.03em;
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.85;
    }

    #grid-wrap {
      position: relative;
      background: var(--board-bg);
      border-radius: 12px;
      padding: 10px;
      width: 100%;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--cell-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: clamp(14px, 5vw, 26px);
      color: var(--text-dark);
      transition: background 0.08s;
      min-width: 0;
    }

    .cell[data-v="2"] {
      background: #eee4da;
    }

    .cell[data-v="4"] {
      background: #ede0c8;
    }

    .cell[data-v="8"] {
      background: #f2b179;
      color: var(--text-light);
    }

    .cell[data-v="16"] {
      background: #f59563;
      color: var(--text-light);
    }

    .cell[data-v="32"] {
      background: #f67c5f;
      color: var(--text-light);
    }

    .cell[data-v="64"] {
      background: #f65e3b;
      color: var(--text-light);
    }

    .cell[data-v="128"] {
      background: #edcf72;
      color: var(--text-light);
      font-size: clamp(12px, 4vw, 22px);
    }

    .cell[data-v="256"] {
      background: #edcc61;
      color: var(--text-light);
      font-size: clamp(12px, 4vw, 22px);
    }

    .cell[data-v="512"] {
      background: #edc850;
      color: var(--text-light);
      font-size: clamp(12px, 4vw, 22px);
    }

    .cell[data-v="1024"] {
      background: #edc53f;
      color: var(--text-light);
      font-size: clamp(10px, 3.5vw, 18px);
    }

    .cell[data-v="2048"] {
      background: #edc22e;
      color: var(--text-light);
      font-size: clamp(10px, 3.5vw, 18px);
    }

    .cell.high {
      background: #3c3a32;
      color: var(--text-light);
      font-size: clamp(9px, 3vw, 14px);
    }

    #msg {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 22px;
      font-weight: 700;
    }

    #msg.over {
      display: flex;
      background: rgba(238, 228, 218, 0.78);
      color: var(--text-dark);
    }

    #msg.win {
      display: flex;
      background: rgba(237, 194, 46, 0.6);
      color: var(--text-light);
    }

    #msg button {
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.3);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-mid);
      text-align: center;
      letter-spacing: 0.02em;
    }

    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
      margin: 14px auto 0;
      width: fit-content;
    }

    .dpad-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--board-bg);
      color: var(--text-light);
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      width: 52px;
      height: 52px;
      flex: unset;
      padding: 0;
      transition: opacity 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .dpad-btn:active {
      opacity: 0.7;
      transform: scale(0.93);
    }

    .dpad-center {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="game-wrap">
    <div id="header">
      <h1>2048</h1>
      <div id="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-val" id="best">0</div>
        </div>
      </div>
    </div>
    <div id="controls"><button id="new-btn">新しいゲーム</button></div>
    <div id="grid-wrap">
      <div id="grid"></div>
      <div id="msg"></div>
    </div>
    <div id="hint">キーボードの矢印キーでも操作できます</div>
    <div id="dpad">
      <div></div>
      <button class="dpad-btn" id="btn-up">↑</button>
      <div></div>
      <button class="dpad-btn" id="btn-left">←</button>
      <div></div>
      <button class="dpad-btn" id="btn-right">→</button>
      <div></div>
      <button class="dpad-btn" id="btn-down">↓</button>
      <div></div>
    </div>
  </div>

  <script>
    let board, score, best = 0, gameOver = false, won = false;

    function init() {
      board = Array(4).fill(0).map(() => Array(4).fill(0));
      score = 0; gameOver = false; won = false;
      document.getElementById('msg').className = '';
      document.getElementById('msg').innerHTML = '';
      addTile(); addTile(); render();
    }

    function addTile() {
      let empty = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!board[r][c]) empty.push([r, c]);
      if (!empty.length) return;
      let [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function slide(row) {
      let arr = row.filter(x => x), gained = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) { arr[i] *= 2; gained += arr[i]; arr.splice(i + 1, 1); }
      }
      while (arr.length < 4) arr.push(0);
      return { arr, gained };
    }

    function move(dir) {
      if (gameOver) return;
      let moved = false, nb = board.map(r => [...r]), gained = 0;
      if (dir === 'left') {
        for (let r = 0; r < 4; r++) { let s = slide(nb[r]); if (s.arr.join() !== nb[r].join()) moved = true; nb[r] = s.arr; gained += s.gained; }
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) { let rev = [...nb[r]].reverse(); let s = slide(rev); s.arr.reverse(); if (s.arr.join() !== nb[r].join()) moved = true; nb[r] = s.arr; gained += s.gained; }
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) { let col = [0, 1, 2, 3].map(r => nb[r][c]); let s = slide(col); if (s.arr.join() !== col.join()) moved = true; s.arr.forEach((v, r) => nb[r][c] = v); gained += s.gained; }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) { let col = [0, 1, 2, 3].map(r => nb[r][c]).reverse(); let s = slide(col); s.arr.reverse(); if (s.arr.join() !== col.reverse().join()) moved = true; s.arr.forEach((v, r) => nb[r][c] = v); gained += s.gained; }
      }
      if (!moved) return;
      board = nb; score += gained;
      if (score > best) best = score;
      addTile(); checkState(); render();
    }

    function checkState() {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (board[r][c] === 2048) { won = true; return; }
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if (!board[r][c]) return;
        if (c < 3 && board[r][c] === board[r][c + 1]) return;
        if (r < 3 && board[r][c] === board[r + 1][c]) return;
      }
      gameOver = true;
    }

    function render() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
      const grid = document.getElementById('grid');
      // 初回だけセルを生成
      if (!grid.children.length) {
        for (let i = 0; i < 16; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          grid.appendChild(cell);
        }
      }
      const cells = grid.children;
      let i = 0;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const v = board[r][c];
        const cell = cells[i++];
        cell.textContent = v || '';
        cell.className = 'cell' + (v > 2048 ? ' high' : '');
        cell.dataset.v = v || '';
      }
      const msg = document.getElementById('msg');
      if (won && !gameOver) {
        msg.className = 'win';
        msg.innerHTML = '🎉 2048達成！<button id="kb">続ける</button>';
        document.getElementById('kb').onclick = () => { won = false; msg.className = ''; };
      } else if (gameOver) {
        msg.className = 'over';
        msg.innerHTML = 'ゲームオーバー<button id="kb">もう一度</button>';
        document.getElementById('kb').onclick = init;
      } else {
        msg.className = '';
        msg.innerHTML = '';
      }
    }

    document.getElementById('new-btn').onclick = init;
    document.addEventListener('keydown', e => {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });
    let tx = 0, ty = 0;
    document.getElementById('btn-up').addEventListener('touchstart', e => { e.preventDefault(); move('up'); }, { passive: false });
    document.getElementById('btn-down').addEventListener('touchstart', e => { e.preventDefault(); move('down'); }, { passive: false });
    document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); move('left'); }, { passive: false });
    document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); move('right'); }, { passive: false });
    document.getElementById('btn-up').onclick = () => move('up');
    document.getElementById('btn-down').onclick = () => move('down');
    document.getElementById('btn-left').onclick = () => move('left');
    document.getElementById('btn-right').onclick = () => move('right');

    init();
  </script>
</body>

</html>
