<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f3;
      --board-bg: #c9b89a;
      --cell-bg: rgba(220, 200, 170, 0.45);
      --text-dark: #3d3228;
      --text-mid: #7a6a5a;
      --text-light: #f9f6f2;
      --accent: #e8a14a;
    }

    body {
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-dark);
      box-sizing: border-box;
    }

    #game-wrap {
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-family: 'DM Mono', monospace;
      font-size: 3rem;
      font-weight: 500;
      letter-spacing: -2px;
      color: var(--text-dark);
      line-height: 1;
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 1rem;
    }

    #scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      position: relative;
      background: var(--board-bg);
      border-radius: 8px;
      padding: 6px 16px;
      text-align: center;
      min-width: 72px;
    }

    .score-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-light);
      opacity: 0.8;
      text-transform: uppercase;
    }

    .score-val {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-light);
      display: inline-block;
    }

    .score-val.pop {
      animation: score-pop 0.35s ease;
    }

    @keyframes score-pop {
      0% {
        transform: scale(1);
        color: var(--text-light);
      }

      50% {
        transform: scale(1.4);
        color: var(--accent);
      }

      100% {
        transform: scale(1);
        color: var(--text-light);
      }
    }

    .float-score {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translate(-50%, 0);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
      animation: float-up 0.8s ease-out forwards;
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -28px);
      }
    }

    #controls {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 8px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: var(--board-bg);
      color: var(--text-light);
      letter-spacing: 0.03em;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      transform: scale(0.95);
    }

    #grid-wrap {
      position: relative;
      background: var(--board-bg);
      border-radius: 12px;
      padding: 10px;
      width: 100%;
    }

    #grid-wrap.shake {
      animation: board-shake 0.28s ease;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--cell-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      color: var(--text-dark);
      transition: background 0.08s;
      min-width: 0;
      will-change: transform;
    }

    .cell-icon {
      font-size: clamp(18px, 6.5vw, 32px);
      line-height: 1;
    }

    .cell-num {
      font-family: 'DM Mono', monospace;
      font-size: clamp(8px, 2.4vw, 11px);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: inherit;
      opacity: 0.7;
    }

    .cell.spawn {
      animation: tile-spawn 0.22s cubic-bezier(0.3, 1.6, 0.4, 1);
    }

    .cell.merged {
      animation: tile-merge 0.26s ease-out;
      z-index: 1;
    }

    @keyframes tile-spawn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      70% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes tile-merge {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.22);
      }

      65% {
        transform: scale(0.94);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes board-shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-6px);
      }

      40% {
        transform: translateX(5px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(2px);
      }
    }

    .cell[data-v="2"] {
      background: #eee4da;
    }

    .cell[data-v="4"] {
      background: #ede0c8;
    }

    .cell[data-v="8"] {
      background: #f2b179;
      color: var(--text-light);
    }

    .cell[data-v="16"] {
      background: #f59563;
      color: var(--text-light);
    }

    .cell[data-v="32"] {
      background: #f67c5f;
      color: var(--text-light);
    }

    .cell[data-v="64"] {
      background: #f65e3b;
      color: var(--text-light);
    }

    .cell[data-v="128"] {
      background: #edcf72;
      color: var(--text-light);
    }

    .cell[data-v="256"] {
      background: #edcc61;
      color: var(--text-light);
    }

    .cell[data-v="512"] {
      background: #edc850;
      color: var(--text-light);
    }

    .cell[data-v="1024"] {
      background: #edc53f;
      color: var(--text-light);
    }

    .cell[data-v="2048"] {
      background: #edc22e;
      color: var(--text-light);
    }

    .cell.high {
      background: #3c3a32;
      color: var(--text-light);
    }

    #msg {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 22px;
      font-weight: 700;
    }

    #msg.over {
      display: flex;
      background: rgba(238, 228, 218, 0.78);
      color: var(--text-dark);
    }

    #msg.win {
      display: flex;
      background: rgba(237, 194, 46, 0.6);
      color: var(--text-light);
    }

    #msg.over,
    #msg.win {
      animation: msg-in 0.3s ease-out;
    }

    @keyframes msg-in {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .msg-text {
      text-align: center;
      line-height: 1.3;
    }

    #msg button {
      flex: 0 0 auto;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.3);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .confetti {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      transform: translate(-50%, -50%);
      animation: confetti-burst 0.7s ease-out forwards;
      pointer-events: none;
    }

    @keyframes confetti-burst {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .cell.spawn,
      .cell.merged,
      #grid-wrap.shake,
      #msg.over,
      #msg.win,
      .score-val.pop,
      .float-score,
      .confetti {
        animation: none !important;
      }
    }

    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-mid);
      text-align: center;
      letter-spacing: 0.02em;
    }

    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
      margin: 14px auto 0;
      width: fit-content;
    }

    .dpad-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--board-bg);
      color: var(--text-light);
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      width: 52px;
      height: 52px;
      flex: unset;
      padding: 0;
      transition: opacity 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .dpad-btn:active {
      opacity: 0.7;
      transform: scale(0.93);
    }

    .dpad-center {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="game-wrap">
    <div id="header">
      <h1>2048</h1>
      <div id="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-val" id="best">0</div>
        </div>
      </div>
    </div>
    <div id="controls"><button id="new-btn">新しいゲーム</button></div>
    <div id="grid-wrap">
      <div id="grid"></div>
      <div id="msg"></div>
    </div>
    <div id="hint">キーボードの矢印キーでも操作できます</div>
    <div id="dpad">
      <div></div>
      <button class="dpad-btn" id="btn-up">↑</button>
      <div></div>
      <button class="dpad-btn" id="btn-left">←</button>
      <div></div>
      <button class="dpad-btn" id="btn-right">→</button>
      <div></div>
      <button class="dpad-btn" id="btn-down">↓</button>
      <div></div>
    </div>
  </div>

  <script>
    let board, score, best = 0, gameOver = false, won = false;
    let lastSpawns = [];
    let lastMerged = Array(4).fill(0).map(() => Array(4).fill(false));
    let lastOrigin = Array(4).fill(0).map(() => Array(4).fill(null));

    // 育っていく自然のモチーフ：種から夜空の星まで
    const ICONS = {
      2: '🌱', 4: '🌿', 8: '🍀', 16: '🌳', 32: '🌸', 64: '🍄',
      128: '🦋', 256: '🐿️', 512: '🦉', 1024: '🌙', 2048: '🌟'
    };
    function getIcon(v) { return v ? (ICONS[v] || '🌌') : ''; }

    function getStep() {
      const grid = document.getElementById('grid');
      const w = grid.getBoundingClientRect().width;
      return (w - 30) / 4 + 10; // セル幅 + 余白
    }

    function init() {
      board = Array(4).fill(0).map(() => Array(4).fill(0));
      score = 0; gameOver = false; won = false;
      lastMerged = Array(4).fill(0).map(() => Array(4).fill(false));
      lastOrigin = Array(4).fill(0).map(() => Array(4).fill(null));
      document.getElementById('msg').className = '';
      document.getElementById('msg').innerHTML = '';
      const s1 = addTile(), s2 = addTile();
      lastSpawns = [s1, s2].filter(Boolean);
      render();
    }

    function addTile() {
      let empty = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!board[r][c]) empty.push([r, c]);
      if (!empty.length) return null;
      let [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
      return [r, c];
    }

    function slide(line) {
      let idx = [], vals = [];
      line.forEach((v, i) => { if (v) { vals.push(v); idx.push(i); } });
      let merged = vals.map(() => false);
      let origin = idx.slice();
      let gained = 0;
      for (let i = 0; i < vals.length - 1; i++) {
        if (vals[i] === vals[i + 1]) {
          vals[i] *= 2; gained += vals[i];
          merged[i] = true;
          origin[i] = idx[i + 1]; // 吸収される側を起点にして動きを見せる
          vals.splice(i + 1, 1);
          merged.splice(i + 1, 1);
          origin.splice(i + 1, 1);
          idx.splice(i + 1, 1);
        }
      }
      while (vals.length < 4) { vals.push(0); merged.push(false); origin.push(-1); }
      return { arr: vals, merged, gained, origin };
    }

    function move(dir) {
      if (gameOver) return;
      let moved = false, nb = board.map(r => [...r]), gained = 0;
      let mergedGrid = Array(4).fill(0).map(() => Array(4).fill(false));
      let originGrid = Array(4).fill(0).map(() => Array(4).fill(null));
      if (dir === 'left') {
        for (let r = 0; r < 4; r++) {
          let s = slide(nb[r]);
          if (s.arr.join() !== nb[r].join()) moved = true;
          nb[r] = s.arr; gained += s.gained;
          s.merged.forEach((m, c) => { if (m) mergedGrid[r][c] = true; });
          s.origin.forEach((o, c) => { if (o !== -1) originGrid[r][c] = [r, o]; });
        }
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let rev = [...nb[r]].reverse();
          let s = slide(rev);
          let arr = [...s.arr].reverse();
          let merged = [...s.merged].reverse();
          if (arr.join() !== nb[r].join()) moved = true;
          nb[r] = arr; gained += s.gained;
          merged.forEach((m, c) => { if (m) mergedGrid[r][c] = true; });
          for (let c = 0; c < 4; c++) {
            const o = s.origin[3 - c];
            if (o !== -1) originGrid[r][c] = [r, 3 - o];
          }
        }
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [0, 1, 2, 3].map(r => nb[r][c]);
          let s = slide(col);
          if (s.arr.join() !== col.join()) moved = true;
          s.arr.forEach((v, r) => nb[r][c] = v);
          gained += s.gained;
          s.merged.forEach((m, r) => { if (m) mergedGrid[r][c] = true; });
          s.origin.forEach((o, r) => { if (o !== -1) originGrid[r][c] = [o, c]; });
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let original = [0, 1, 2, 3].map(r => nb[r][c]);
          let col = [...original].reverse();
          let s = slide(col);
          let arr = [...s.arr].reverse();
          let merged = [...s.merged].reverse();
          if (arr.join() !== original.join()) moved = true;
          arr.forEach((v, r) => nb[r][c] = v);
          gained += s.gained;
          merged.forEach((m, r) => { if (m) mergedGrid[r][c] = true; });
          for (let r = 0; r < 4; r++) {
            const o = s.origin[3 - r];
            if (o !== -1) originGrid[r][c] = [3 - o, c];
          }
        }
      }
      if (!moved) { shakeBoard(); return; }
      board = nb; score += gained;
      if (score > best) best = score;
      lastMerged = mergedGrid;
      lastOrigin = originGrid;
      lastSpawns = [addTile()].filter(Boolean);
      if (gained > 0) popScore(gained);
      checkState(); render();
    }

    function shakeBoard() {
      const gw = document.getElementById('grid-wrap');
      gw.classList.remove('shake');
      void gw.offsetWidth;
      gw.classList.add('shake');
      gw.addEventListener('animationend', () => gw.classList.remove('shake'), { once: true });
    }

    function popScore(gained) {
      const scoreEl = document.getElementById('score');
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
      const box = scoreEl.closest('.score-box');
      const float = document.createElement('div');
      float.className = 'float-score';
      float.textContent = '+' + gained;
      box.appendChild(float);
      float.addEventListener('animationend', () => float.remove());
    }

    function celebrate() {
      const wrap = document.getElementById('grid-wrap');
      const colors = ['#e8a14a', '#f2b179', '#edc850', '#f65e3b', '#3d3228'];
      const count = 16;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'confetti';
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const dist = 60 + Math.random() * 50;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        p.style.background = colors[i % colors.length];
        wrap.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    function checkState() {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (board[r][c] === 2048) {
        if (!won) celebrate();
        won = true; return;
      }
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if (!board[r][c]) return;
        if (c < 3 && board[r][c] === board[r][c + 1]) return;
        if (r < 3 && board[r][c] === board[r + 1][c]) return;
      }
      gameOver = true;
    }

    function render() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
      const grid = document.getElementById('grid');
      // 初回だけセルを生成
      if (!grid.children.length) {
        for (let i = 0; i < 16; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerHTML = '<span class="cell-icon"></span><span class="cell-num"></span>';
          grid.appendChild(cell);
        }
      }
      const cells = grid.children;
      const step = getStep();
      const slidingCells = [];
      let i = 0;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const v = board[r][c];
        const cell = cells[i++];
        cell.classList.remove('spawn', 'merged', 'high');
        cell.style.transition = 'none';
        cell.style.transform = '';
        cell.querySelector('.cell-icon').textContent = getIcon(v);
        cell.querySelector('.cell-num').textContent = v || '';
        if (v > 2048) cell.classList.add('high');
        cell.dataset.v = v || '';

        const isSpawn = lastSpawns.some(s => s && s[0] === r && s[1] === c);
        const origin = lastOrigin[r][c];
        if (origin && !isSpawn) {
          const dx = (origin[1] - c) * step;
          const dy = (origin[0] - r) * step;
          cell.style.transform = `translate(${dx}px, ${dy}px)`;
          slidingCells.push(cell);
        }
      }

      if (slidingCells.length) {
        // FLIP: 開始位置にセットしてから本来の位置へ滑らせる
        void grid.offsetWidth;
        requestAnimationFrame(() => {
          slidingCells.forEach(cell => {
            cell.style.transition = 'transform 0.13s ease';
            cell.style.transform = '';
          });
        });
      }

      const finishDelay = slidingCells.length ? 140 : 0;
      setTimeout(() => {
        let j = 0;
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
          const cell = cells[j++];
          cell.style.transition = '';
          if (lastMerged[r][c]) cell.classList.add('merged');
          if (lastSpawns.some(s => s && s[0] === r && s[1] === c)) cell.classList.add('spawn');
        }
        lastSpawns = [];
        lastOrigin = Array(4).fill(0).map(() => Array(4).fill(null));
        lastMerged = Array(4).fill(0).map(() => Array(4).fill(false));
      }, finishDelay);

      const msg = document.getElementById('msg');
      if (won && !gameOver) {
        msg.className = 'win';
        msg.innerHTML = '<div class="msg-text">🎉 2048達成！</div><button id="kb">続ける</button>';
        document.getElementById('kb').onclick = () => { won = false; msg.className = ''; msg.innerHTML = ''; };
      } else if (gameOver) {
        msg.className = 'over';
        msg.innerHTML = '<div class="msg-text">ゲームオーバー</div><button id="kb">もう一度</button>';
        document.getElementById('kb').onclick = init;
      } else {
        msg.className = '';
        msg.innerHTML = '';
      }
    }

    document.getElementById('new-btn').onclick = init;
    document.addEventListener('keydown', e => {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });
    let tx = 0, ty = 0;
    document.getElementById('btn-up').addEventListener('touchstart', e => { e.preventDefault(); move('up'); }, { passive: false });
    document.getElementById('btn-down').addEventListener('touchstart', e => { e.preventDefault(); move('down'); }, { passive: false });
    document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); move('left'); }, { passive: false });
    document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); move('right'); }, { passive: false });
    document.getElementById('btn-up').onclick = () => move('up');
    document.getElementById('btn-down').onclick = () => move('down');
    document.getElementById('btn-left').onclick = () => move('left');
    document.getElementById('btn-right').onclick = () => move('right');

    init();
  </script>
</body>

</html>
